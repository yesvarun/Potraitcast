plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'portrait.cast'
    compileSdk 34

    defaultConfig {
        applicationId 'portrait.cast'
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Flat layout so the repo is easy to manage from GitHub's web UI
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
